name: Coverage Check

on: 
  push:
    branches: [main, dev, fix/issue-20-fuzz-invariant-testing]
  pull_request:
    branches: [main, dev]

env:
  COVERAGE_SENSITIVITY_PERCENT: 1
  COVERAGE_THRESHOLD: 80

jobs:
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --frozen-lockfile --network-concurrency 1

      - name: Run coverage
        run: |
          forge coverage --report lcov --report summary --report-file lcov.info
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          forge coverage --report summary >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Filter coverage
        run: |
          lcov --remove lcov.info 'test/*' 'script/*' 'node_modules/*' \
               --output-file lcov.filtered.info \
               --rc lcov_branch_coverage=1 \
               --rc derive_function_end_line=0 \
               --ignore-errors unused

      - name: Generate HTML report
        run: |
          genhtml lcov.filtered.info \
                  --output-directory coverage-html \
                  --title "Saving Circles Coverage Report" \
                  --show-details \
                  --legend

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.filtered.info
          flags: foundry
          name: saving-circles-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-coverage-badge: true
          coverage-badge-filename: coverage.svg
          coverage-label: Coverage
          intervals: 100 90 80 70 60 50 0
          colors: brightgreen green yellowgreen yellow orange red
          on-missing-report: fail
          fail-if-coverage-less-than: 0
          fail-on-coverage-decrease: false
          coverage-json-summary: |
            {
              "coverage": ${{ steps.coverage-report.outputs.total-coverage || '0' }}
            }
        continue-on-error: true

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov.info
            lcov.filtered.info
          retention-days: 30

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 30

      - name: Upload coverage summary artifact
        run: |
          forge coverage --report summary > coverage-summary.txt
          echo "---" >> coverage-summary.txt
          echo "Generated at: $(date)" >> coverage-summary.txt
          echo "Commit: ${{ github.sha }}" >> coverage-summary.txt
          echo "Branch: ${{ github.ref_name }}" >> coverage-summary.txt
        shell: bash

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: lcov.filtered.info
          minimum-coverage: ${{ env.COVERAGE_THRESHOLD }}
          artifact-name: coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: Check coverage threshold
        id: coverage-check
        run: |
          # Extract total coverage percentage from summary
          COVERAGE=$(forge coverage --report summary | grep "| Total" | awk '{print $3}' | sed 's/%.*$//' | sed 's/\..*//')
          echo "Current coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          
          if [ "$COVERAGE" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
            echo "❌ Coverage $COVERAGE% is below threshold of ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          else
            echo "✅ Coverage $COVERAGE% meets threshold of ${{ env.COVERAGE_THRESHOLD }}%"
          fi

      - name: Create coverage badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          COVERAGE=${{ steps.coverage-check.outputs.coverage }}
          COLOR="red"
          if [ "$COVERAGE" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$COVERAGE" -ge 80 ]; then COLOR="green"
          elif [ "$COVERAGE" -ge 70 ]; then COLOR="yellowgreen"
          elif [ "$COVERAGE" -ge 60 ]; then COLOR="yellow"
          elif [ "$COVERAGE" -ge 50 ]; then COLOR="orange"
          fi
          
          echo "Creating badge with coverage: $COVERAGE% and color: $COLOR"
          mkdir -p .github/badges
          curl -s "https://img.shields.io/badge/Coverage-${COVERAGE}%25-${COLOR}" > .github/badges/coverage.svg

      - name: Commit coverage badge
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/badges/coverage.svg || true
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
        continue-on-error: true

      - name: Push badge
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
        continue-on-error: true