name: Deploy

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade-safety:
    uses: BreadchainCoop/etherform/.github/workflows/_upgrade-safety.yml@franrolotti/pr-deployment-comment
    with:
      base-branch: "dev"
      package-manager: "yarn"

  deploy-testnet:
    name: Upgrade Testnet
    runs-on: ubuntu-latest
    needs: [upgrade-safety]
    env:
      TESTNET_PROXY_ADDRESS: "0x58ad17fe5db2a4228942991bca1bb7a1ff5e54a1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout etherform scripts
        uses: actions/checkout@v4
        with:
          repository: BreadchainCoop/etherform
          ref: franrolotti/pr-deployment-comment
          path: .etherform
          sparse-checkout: scripts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Upgrade proxy and deploy auxiliaries
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          DEPLOY_ENV_VARS: ${{ secrets.DEPLOY_ENV_VARS }}
          PROXY_ADDRESS: ${{ env.TESTNET_PROXY_ADDRESS }}
        run: |
          source .etherform/scripts/deploy/prepare-env.sh
          forge script "script/UpgradeTestnet.sol:UpgradeTestnet" \
            --rpc-url "$RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            --slow \
            -vvvv

      - name: Wait for indexing
        run: sleep 60

      - name: Parse deployment addresses
        id: parse
        run: bash .etherform/scripts/deploy/parse-broadcast.sh

      - name: Resolve Blockscout URL from chain ID
        id: network
        env:
          CHAIN_ID: ${{ steps.parse.outputs.chain_id }}
          NETWORK_CONFIG: .github/deploy-networks.json
        run: bash .etherform/scripts/deploy/resolve-network.sh

      - name: Create deployment summary
        env:
          BLOCKSCOUT_URL: ${{ steps.network.outputs.blockscout_url }}
          SUMMARY_TITLE: Testnet Upgrade Summary
        run: bash .etherform/scripts/deploy/deployment-summary.sh

      - name: Verify contracts on Etherscan
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETH_RPC_URL: ${{ secrets.RPC_URL }}
          BROADCAST_FILE: ${{ steps.parse.outputs.broadcast_file }}
        run: |
          jq -c '.transactions[] | select(.transactionType == "CREATE") | {name: .contractName, address: .contractAddress}' "$BROADCAST_FILE" |
          while read -r contract; do
            CONTRACT_NAME=$(echo "$contract" | jq -r '.name')
            CONTRACT_ADDR=$(echo "$contract" | jq -r '.address')

            echo "Verifying $CONTRACT_NAME ($CONTRACT_ADDR) on Etherscan..."
            forge verify-contract "$CONTRACT_ADDR" "$CONTRACT_NAME" \
              --chain sepolia \
              --rpc-url "$ETH_RPC_URL" \
              --etherscan-api-key "$ETHERSCAN_API_KEY" \
              --guess-constructor-args
          done
