name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  foundry:
    uses: BreadchainCoop/etherform/.github/workflows/_foundry-cicd.yml@16ca06e46b634c9df22c391e5c22cabd4623306b
    permissions:
      contents: read
      pull-requests: write
    with:
      main-branch: "dev"
      package-manager: "yarn"
      deploy-on-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      deploy-script: "script/Deploy.sol:Deploy"
      run-slither: false
      run-coverage: true
      run-halmos: true
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      RPC_URL: ${{ secrets.RPC_URL }}
      DEPLOY_ENV_VARS: ${{ secrets.DEPLOY_ENV_VARS }}

  lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"

      - name: Install dependencies
        run: yarn --frozen-lockfile --network-concurrency 1

      - run: yarn lint:check
